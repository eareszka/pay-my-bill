{% extends "base.html" %}
{% block title %}{{ title }} · Pay My Bill{% endblock %}
{% block content %}
  <div class="error-page">
  <h1>{{ title }}</h1>
  <p>{{ message }}</p>
  {% if back %}
    <p><a class="btn" href="{{ back }}">Go back</a></p>
  {% else %}
    <p><a class="btn" href="{{ url_for('main.index') }}">See who needs a hand</a></p>
  {% endif %}
  </div>
{% endblock %}
