{% macro field(f) %}
  <label class="field">
    <span>{{ f.label.text }}</span>
    {% if f.errors %}
      {{ f(aria_invalid="true", aria_describedby=f.id ~ "-error", **kwargs) }}
      <small class="error" id="{{ f.id }}-error">{{ f.errors | join(" ") }}</small>
    {% else %}
      {{ f(**kwargs) }}
      {% if f.description %}<small>{{ f.description }}</small>{% endif %}
    {% endif %}
  </label>
{% endmacro %}
