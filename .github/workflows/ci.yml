name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      # Actions are pinned to a commit, not a movable tag (#177).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # gitleaks scans the whole history
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        # The locked versions Render deploys, then the dev tools.
        # pip check fails if pyproject needs something the lock lacks, which would
        # pass here and then crash on Render's --no-deps install.
        run: |
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
          pip check
          pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest
      - name: Dependency audit
        run: |
          pip-audit --skip-editable
          pip-audit -r requirements.lock --require-hashes --disable-pip
      - name: Secret scan
        env:
          GITLEAKS_VERSION: 8.21.2
          GITLEAKS_SHA256: 5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba
        run: |
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum --check
          tar -xzf "$tarball" gitleaks
          ./gitleaks git --redact --verbose .
