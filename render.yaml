services:
  - type: web
    name: pay-my-bill-staging
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install .
    startCommand: flask --app app db upgrade && gunicorn --bind 0.0.0.0:$PORT "app:create_app()"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FLASK_ENV
        value: production
      - key: APP_URL
        value: https://pay-my-bill-staging.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pay-my-bill-staging-db
          property: connectionString

databases:
  - name: pay-my-bill-staging-db
    plan: free
    databaseName: pay_my_bill
    user: pay_my_bill
