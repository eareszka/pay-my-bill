services:
  - type: web
    name: pay-my-bill-staging
    runtime: python
    plan: free
    branch: main
    autoDeploy: true
    buildCommand: pip install .
    startCommand: flask --app app db upgrade && gunicorn --bind 0.0.0.0:$PORT "app:create_app()"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: FLASK_ENV
        value: production
      - key: APP_URL
        value: https://pay-my-bill-staging.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: CONTACT_EMAIL
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CONNECT_WEBHOOK_SECRET
        sync: false
      # Post photos live in Cloudflare R2 (ADR 0015); Render's free disk is wiped on deploy.
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
      # Neon's free Postgres, which doesn't expire like Render's free database (#33).
      # Set in the dashboard to Neon's direct (unpooled) connection string.
      - key: DATABASE_URL
        sync: false
